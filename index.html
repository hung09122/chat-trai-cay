<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chặt Trái Cây Đỉnh Cao</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
</head>
<body>
{
            background: #0f172a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            background: linear-gradient(45deg, #f43f5e, #fbbf24, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            background: #1e293b;
            border: 4px solid #334155;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            cursor: crosshair;
        }
        canvas {
            display: block;
            background: radial-gradient(circle, #334155 0%, #0f172a 100%);
            transition: background 0.5s;
        }
        .ui-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.88);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            z-index: 10;
        }
        .ui-screen h2 {
            font-size: 2rem;
            margin-bottom: 12px;
            color: #fbbf24;
        }
        .ui-screen p {
            margin-bottom: 20px;
            color: #94a3b8;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        .btn {
            background: linear-gradient(45deg, #f43f5e, #fbbf24);
            color: #0f172a;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.4);
        }
        .btn:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }
        #scoreboard {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: bold;
            z-index: 5;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .lives {
            color: #f43f5e;
        }
        #combo-popup {
            position: absolute;
            top: 70px;
            width: 100%;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
            z-index: 6;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #active-effects {
            position: absolute;
            top: 50px;
            left: 15px;
            font-size: 0.85rem;
            color: #38bdf8;
            z-index: 5;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <h1>🍉 Chặt Trái Cây Đỉnh Cao (Bản Nâng Cấp)</h1>
    
    <div id="game-container">
        <div id="scoreboard">
            <div>Điểm: <span id="score">0</span></div>
            <div class="lives">Mạng: <span id="lives">❤️❤️❤️</span></div>
        </div>
        <div id="active-effects"></div>
        <div id="combo-popup"></div>

        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <!-- Màn hình Bắt đầu -->
        <div id="start-screen" class="ui-screen">
            <h2>Sẵn sàng chém bùng nổ?</h2>
            <p>Tránh <b>Bom (💣)</b>. Khám phá <b>Chuối Đóng Băng (❄️)</b> và <b>Dứa x2 Điểm (🍍)</b>. Đạt điểm cao để kích hoạt <b>Frenzy Mode</b>!</p>
            <button class="btn" onclick="startGame()">BẮT ĐẦU NGAY</button>
        </div>

        <!-- Màn hình Thua cuộc -->
        <div id="gameover-screen" class="ui-screen" style="display: none;">
            <h2>💥 KẾT THÚC TRÒ CHƠI</h2>
            <p>Điểm số đạt được: <span id="final-score">0</span><br>Kỷ lục mới sẽ thuộc về bạn?</p>
            <button class="btn" onclick="startGame()">CHƠI LẠI</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Web Audio API khởi tạo âm thanh
        let audioCtx = null;
        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'slice') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'bomb') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.4);
                    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                } else if (type === 'special') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.2);
                }
            } catch(e) {}
        }

        let score = 0;
        let lives = 3;
        let isPlaying = false;
        let fruits = [];
        let particles = [];
        let sliceTrail = [];
        let spawnTimer = 0;
        
        // Trạng thái hiệu ứng đặc biệt
        let doublePointsTimer = 0;
        let freezeTimer = 0;
        let frenzyTimer = 0;

        const fruitTypes = [
            { name: 'Watermelon', emoji: '🍉', radius: 35, points: 1 },
            { name: 'Apple', emoji: '🍎', radius: 28, points: 1 },
            { name: 'Orange', emoji: '🍊', radius: 30, points: 2 },
            { name: 'Grape', emoji: '🍇', radius: 26, points: 3 },
            { name: 'FreezeBanana', emoji: '🍌❄️', radius: 30, isFreeze: true },
            { name: 'DoublePineapple', emoji: '🍍✨', radius: 32, isDouble: true },
            { name: 'Bomb', emoji: '💣', radius: 30, isBomb: true }
        ];

        let isDragging = false;

        function addPoint(x, y) {
            sliceTrail.push({ x, y, alpha: 1 });
            if (sliceTrail.length > 12) sliceTrail.shift();
        }

        canvas.addEventListener("mousedown", (e) => {
            isDragging = true;
            let rect = canvas.getBoundingClientRect();
            addPoint(e.clientX - rect.left, e.clientY - rect.top);
        });

        canvas.addEventListener("mousemove", (e) => {
            if (!isDragging || !isPlaying) return;
            let rect = canvas.getBoundingClientRect();
            let x = e.clientX - rect.left;
            let y = e.clientY - rect.top;
            addPoint(x, y);
            checkSlice(x, y);
        });

        window.addEventListener("mouseup", () => {
            isDragging = false;
            sliceTrail = [];
        });

        canvas.addEventListener("touchstart", (e) => {
            isDragging = true;
            let rect = canvas.getBoundingClientRect();
            let x = e.touches[0].clientX - rect.left;
            let y = e.touches[0].clientY - rect.top;
            addPoint(x, y);
            e.preventDefault();
        });

        canvas.addEventListener("touchmove", (e) => {
            if (!isDragging || !isPlaying) return;
            let rect = canvas.getBoundingClientRect();
            let x = e.touches[0].clientX - rect.left;
            let y = e.touches[0].clientY - rect.top;
            addPoint(x, y);
            checkSlice(x, y);
            e.preventDefault();
        });

        canvas.addEventListener("touchend", () => {
            isDragging = false;
            sliceTrail = [];
        });

        function startGame() {
            document.getElementById("start-screen").style.display = "none";
            document.getElementById("gameover-screen").style.display = "none";
            score = 0;
            lives = 3;
            fruits = [];
            particles = [];
            spawnTimer = 0;
            doublePointsTimer = 0;
            freezeTimer = 0;
            frenzyTimer = 0;
            isPlaying = true;
            updateLivesUI();
            loop();
        }

        function gameOver() {
            isPlaying = false;
            playSound('bomb');
            document.getElementById("final-score").innerText = score;
            document.getElementById("gameover-screen").style.display = "flex";
        }

        function updateLivesUI() {
            let hearts = "";
            for (let i = 0; i < lives; i++) hearts += "❤️";
            document.getElementById("lives").innerText = hearts;
        }

        function showCombo(text) {
            let el = document.getElementById("combo-popup");
            el.innerText = text;
            el.style.opacity = "1";
            setTimeout(() => { el.style.opacity = "0"; }, 800);
        }

        function spawnFruit() {
            let type = fruitTypes[Math.floor(Math.random() * fruitTypes.length)];
            // Giảm tỉ lệ bom và đồ hiếm cho cân bằng
            if ((type.isBomb || type.isFreeze || type.isDouble) && Math.random() > 0.45) {
                type = fruitTypes[0];
            }

            let x = Math.random() * (canvas.width - 100) + 50;
            let vx = (canvas.width / 2 - x) * 0.02 + (Math.random() - 0.5) * 2;
            let vy = -Math.random() * 4 - 11;

            if (frenzyTimer > 0) {
                vy -= 3; // Bay nhanh hơn trong chế độ Frenzy
            }

            fruits.push({
                x: x,
                y: canvas.height + 40,
                vx: vx,
                vy: vy,
                gravity: 0.35,
                ...type,
                sliced: false
            });
        }

        function createParticles(x, y) {
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 9,
                    vy: (Math.random() - 0.5) * 9,
                    radius: Math.random() * 5 + 2,
                    color: ['#f43f5e', '#fbbf24', '#38bdf8', '#a855f7'][Math.floor(Math.random()*4)],
                    alpha: 1
                });
            }
        }

        function checkSlice(x, y) {
            let slicedCount = 0;
            fruits.forEach(f => {
                if (!f.sliced) {
                    let dist = Math.hypot(f.x - x, f.y - y);
                    if (dist < f.radius + 18) {
                        f.sliced = true;
                        slicedCount++;

                        if (f.isBomb) {
                            lives = 0;
                            updateLivesUI();
                            gameOver();
                        } else {
                            playSound('slice');
                            createParticles(f.x, f.y);

                            let pts = f.points || 1;
                            if (doublePointsTimer > 0) pts *= 2;

                            if (f.isFreeze) {
                                freezeTimer = 300; // Đóng băng 5 giây
                                playSound('special');
                                showCombo("❄️ ĐÓNG BĂNG!");
                            } else if (f.isDouble) {
                                doublePointsTimer = 300; // x2 điểm 5 giây
                                playSound('special');
                                showCombo("🍍 NHÂN ĐÔI ĐIỂM!");
                            }

                            score += pts;
                        }
                    }
                }
            });

            if (slicedCount >= 3) {
                showCombo(`🔥 COMBO x${slicedCount}!`);
                score += slicedCount * 2;
            }
        }

        function update() {
            if (!isPlaying) return;

            // Xử lý bộ đếm thời gian hiệu ứng
            if (freezeTimer > 0) freezeTimer--;
            if (doublePointsTimer > 0) doublePointsTimer--;
            if (frenzyTimer > 0) frenzyTimer--;

            // Cập nhật text trạng thái hiệu ứng
            let effectText = "";
            if (freezeTimer > 0) effectText += `❄️ Đóng băng: ${(freezeTimer/60).toFixed(1)}s  `;
            if (doublePointsTimer > 0) effectText += `🍍 x2 Điểm: ${(doublePointsTimer/60).toFixed(1)}s  `;
            if (frenzyTimer > 0) effectText += `🔥 FRENZY MODE! `;
            document.getElementById("active-effects").innerText = effectText;

            // Kích hoạt Frenzy tự động khi điểm chia hết cho 30
            if (score > 0 && score % 30 === 0 && frenzyTimer <= 0 && Math.random() < 0.1) {
                frenzyTimer = 250;
                showCombo("🌟 FRENZY BÙNG NỔ! 🌟");
            }

            // Tần suất tung trái cây
            let spawnInterval = (freezeTimer > 0) ? 70 : (frenzyTimer > 0 ? 20 : 45);
            spawnTimer++;
            if (spawnTimer > spawnInterval) {
                spawnTimer = 0;
                spawnFruit();
                if (frenzyTimer > 0 || Math.random() > 0.6) spawnFruit();
            }

            // Cập nhật vị trí trái cây (nếu đóng băng thì tốc độ giảm mạnh)
            let speedFactor = (freezeTimer > 0) ? 0.35 : 1;

            for (let i = fruits.length - 1; i >= 0; i--) {
                let f = fruits[i];
                f.x += f.vx * speedFactor;
                f.y += f.vy * speedFactor;
                f.vy += f.gravity * speedFactor;

                if (f.y > canvas.height + 50) {
                    if (!f.sliced && !f.isBomb) {
                        lives--;
                        updateLivesUI();
                        if (lives <= 0) gameOver();
                    }
                    fruits.splice(i, 1);
                }
            }

            // Cập nhật hạt văng
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            sliceTrail.forEach(t => t.alpha -= 0.12);
            sliceTrail = sliceTrail.filter(t => t.alpha > 0);

            document.getElementById("score").innerText = score;
        }

        function draw() {
            // Thay đổi màu nền khi bật Frenzy Mode
            if (frenzyTimer > 0) {
                ctx.fillStyle = "rgba(124, 45, 18, 0.25)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }

            // Vẽ trái cây
            fruits.forEach(f => {
                ctx.font = f.isBomb ? "38px Arial" : "34px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(f.emoji, f.x, f.y);
            });

            // Vẽ hạt nước trái cây
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Vẽ đường chém neon
            if (sliceTrail.length > 1) {
                ctx.strokeStyle = frenzyTimer > 0 ? "rgba(250, 204, 21, 0.9)" : "rgba(56, 189, 248, 0.85)";
                ctx.lineWidth = 5;
                ctx.lineCap = "round";
                ctx.beginPath();
                ctx.moveTo(sliceTrail[0].x, sliceTrail[0].y);
                for (let i = 1; i < sliceTrail.length; i++) {
                    ctx.lineTo(sliceTrail[i].x, sliceTrail[i].y);
                }
                ctx.stroke();
            }
        }

        function loop() {
            if (!isPlaying) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
