<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chặt Trái Cây Đỉnh Cao</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
</head>
<body>
{
            background: #020307;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            font-size: 1.2rem;
            margin-bottom: 5px;
            background: linear-gradient(45deg, #ff3366, #ffcc00, #00ffcc, #bf00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 900;
        }
        #game-container {
            position: relative;
            width: 750px;
            height: 600px;
            background: #0d131f;
            border: 4px solid #1e293b;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 80px rgba(191, 0, 255, 0.2), 0 30px 60px rgba(0,0,0,0.9);
            cursor: crosshair;
        }
        canvas {
            display: block;
            background: radial-gradient(circle at center, #1b263b 0%, #060911 100%);
        }

        .ui-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(7, 10, 18, 0.97) 0%, rgba(15, 23, 42, 0.99) 100%);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 25px;
            z-index: 10;
        }
        .logo-badge {
            font-size: 3.2rem;
            margin-bottom: 8px;
            animation: floatLogo 2s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 25px rgba(255, 204, 0, 0.7));
        }
        @keyframes floatLogo {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-8px) scale(1.06); }
        }
        .ui-screen h2 {
            font-size: 1.7rem;
            margin-bottom: 6px;
            color: #ffcc00;
            text-shadow: 0 2px 10px rgba(255, 204, 0, 0.4);
        }
        .ui-screen p {
            margin-bottom: 16px;
            color: #94a3b8;
            font-size: 0.88rem;
            line-height: 1.5;
            max-width: 420px;
        }

        .blade-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .blade-btn {
            background: #1e293b;
            border: 2px solid #334155;
            color: #fff;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .blade-btn.active {
            border-color: #00ffcc;
            background: rgba(0, 255, 204, 0.15);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }

        .btn {
            background: linear-gradient(135deg, #ff3366 0%, #ff9900 100%);
            color: #fff;
            border: none;
            padding: 12px 36px;
            font-size: 1rem;
            font-weight: 800;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 51, 102, 0.5);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.2s ease;
        }
        .btn:hover { transform: scale(1.08); box-shadow: 0 10px 30px rgba(255, 51, 102, 0.7); }

        #scoreboard {
            position: absolute;
            top: 15px; left: 20px; right: 20px;
            display: flex; justify-content: space-between;
            font-size: 1.1rem; font-weight: bold; z-index: 5; pointer-events: none;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }
        .lives { color: #ff3366; font-size: 1.2rem; }
        #combo-popup {
            position: absolute; top: 75px; width: 100%; text-align: center;
            font-size: 1.8rem; font-weight: 900; color: #ffcc00;
            text-shadow: 0 0 20px rgba(255, 204, 0, 0.9);
            z-index: 6; pointer-events: none; opacity: 0;
            transform: scale(0.5);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.4);
        }
    </style>
</head>
<body>

    <h1>⚔️ Fruit Ninja: Ultimate Chaos & Blade Masters 🌟</h1>
    
    <div id="game-container">
        <div id="scoreboard">
            <div>Điểm: <span id="score" style="color:#00ffcc;">0</span> | Kỷ lục: <span id="highscore" style="color:#ffcc00;">0</span></div>
            <div class="lives"><span id="lives">❤️❤️❤️</span></div>
        </div>
        <div id="combo-popup"></div>

        <canvas id="gameCanvas" width="750" height="600"></canvas>

        <div id="start-screen" class="ui-screen">
            <div class="logo-badge">⚔️️🔥</div>
            <h2>Chọn Lưỡi Kiếm Huyền Thoại</h2>
            <div class="blade-selector">
                <button class="blade-btn active" onclick="setBlade('neon', this)">⚡ Neon Cyan</button>
                <button class="blade-btn" onclick="setBlade('inferno', this)">🔥 Inferno</button>
                <button class="blade-btn" onclick="setBlade('void', this)">💜 Void Stalker</button>
                <button class="blade-btn" onclick="setBlade('rainbow', this)">🌈 Rainbow</button>
            </div>
            <p>Trải nghiệm Chuối Cuồng Nộ (Frenzy), Dừa Giáp Cứng, chém Kritical và hiệu ứng hỗn chiến tối thượng!</p>
            <button class="btn" onclick="startGame()">VÀO TRẬN CHIẾN</button>
        </div>

        <div id="gameover-screen" class="ui-screen" style="display: none;">
            <div class="logo-badge">💥</div>
            <h2>GAME OVER</h2>
            <p>Điểm số đạt được: <span id="final-score" style="color:#fff; font-size:1.3rem; font-weight:bold;">0</span><br>Kỷ lục cao nhất: <span id="final-highscore" style="color:#ffcc00; font-size:1.3rem; font-weight:bold;">0</span></p>
            <button class="btn" onclick="startGame()">CHƠI LẠI</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let currentBlade = 'neon';
        function setBlade(type, btn) {
            currentBlade = type;
            document.querySelectorAll('.blade-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        let audioCtx = null;
        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                if (type === 'slice') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1400, audioCtx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.08);
                } else if (type === 'crit') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(900, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1800, audioCtx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.12);
                } else if (type === 'frenzy') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'bomb') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(20, audioCtx.currentTime + 0.5);
                    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.5);
                }
            } catch(e) {}
        }

        let score = 0, highscore = localStorage.getItem("fruit_ninja_chaos_hs") || 0;
        document.getElementById("highscore").innerText = highscore;

        let lives = 3, isPlaying = false;
        let fruits = [], halvedFruits = [], juiceSplashes = [], sliceTrail = [], fxRings = [], debrisList = [];
        let spawnTimer = 0, hitStopFrames = 0, screenShakeFrames = 0, flashAlpha = 0;
        let frenzyTimer = 0, slowMoFrames = 0;

        const fruitTypes = [
            { type: 'watermelon', radius: 36, points: 1, outer: '#1b4332', inner: '#d90429', seed: '#111' },
            { type: 'apple', radius: 28, points: 1, outer: '#d90429', inner: '#ffb703', seed: '#3d2314' },
            { type: 'orange', radius: 30, points: 2, outer: '#f77f00', inner: '#fcbf49', seed: '#fff' },
            { type: 'coconut', radius: 32, points: 3, outer: '#4a2e1b', inner: '#fff', seed: '#b5838d', armor: 2 }, // Cần chém 2 lần
            { type: 'banana', radius: 25, points: 5, outer: '#e9c46a', inner: '#f4a261', seed: '#fff', isFrenzy: true }, // Chuối cuồng nộ
            { type: 'bomb', radius: 28, isBomb: true }
        ];

        let isDragging = false;
        function addPoint(x, y) {
            sliceTrail.push({ x, y, alpha: 1, blade: currentBlade });
            if (sliceTrail.length > 15) sliceTrail.shift();
        }

        canvas.addEventListener("mousedown", (e) => {
            isDragging = true;
            let rect = canvas.getBoundingClientRect();
            addPoint(e.clientX - rect.left, e.clientY - rect.top);
        });
        canvas.addEventListener("mousemove", (e) => {
            if (!isDragging || !isPlaying) return;
            let rect = canvas.getBoundingClientRect();
            let x = e.clientX - rect.left, y = e.clientY - rect.top;
            addPoint(x, y);
            checkSlice(x, y);
        });
        window.addEventListener("mouseup", () => { isDragging = false; });

        canvas.addEventListener("touchstart", (e) => {
            isDragging = true;
            let rect = canvas.getBoundingClientRect();
            let x = e.touches[0].clientX - rect.left, y = e.touches[0].clientY - rect.top;
            addPoint(x, y); e.preventDefault();
        });
        canvas.addEventListener("touchmove", (e) => {
            if (!isDragging || !isPlaying) return;
            let rect = canvas.getBoundingClientRect();
            let x = e.touches[0].clientX - rect.left, y = e.touches[0].clientY - rect.top;
            addPoint(x, y); checkSlice(x, y); e.preventDefault();
        });
        canvas.addEventListener("touchend", () => { isDragging = false; });

        function startGame() {
            document.getElementById("start-screen").style.display = "none";
            document.getElementById("gameover-screen").style.display = "none";
            score = 0; lives = 3; fruits = []; halvedFruits = []; juiceSplashes = []; fxRings = []; debrisList = [];
            spawnTimer = 0; hitStopFrames = 0; screenShakeFrames = 0; flashAlpha = 0;
            frenzyTimer = 0; slowMoFrames = 0;
            isPlaying = true;
            updateLivesUI();
            loop();
        }

        function gameOver() {
            isPlaying = false;
            playSound('bomb');
            screenShakeFrames = 25;
            flashAlpha = 0.85;
            if (score > highscore) {
                highscore = score;
                localStorage.setItem("fruit_ninja_chaos_hs", highscore);
                document.getElementById("highscore").innerText = highscore;
            }
            document.getElementById("final-score").innerText = score;
            document.getElementById("final-highscore").innerText = highscore;
            document.getElementById("gameover-screen").style.display = "flex";
        }

        function updateLivesUI() {
            let h = ""; for (let i = 0; i < lives; i++) h += "❤";
            document.getElementById("lives").innerText = h;
        }

        function showPopup(text, color = "#ffcc00") {
            let el = document.getElementById("combo-popup");
            el.innerText = text;
            el.style.color = color;
            el.style.opacity = "1";
            el.style.transform = "scale(1.4)";
            setTimeout(() => { el.style.opacity = "0"; el.style.transform = "scale(0.8)"; }, 700);
        }

        function spawnFruit() {
            let template = fruitTypes[Math.floor(Math.random() * fruitTypes.length)];
            if (template.isBomb && Math.random() > 0.22) template = fruitTypes[0];
            
            let x = Math.random() * (canvas.width - 160) + 80;
            let vx = (canvas.width / 2 - x) * 0.02 + (Math.random() - 0.5) * 4;
            let vy = -Math.random() * 4 - (frenzyTimer > 0 ? 14 : 12);
            fruits.push({ x, y: canvas.height + 50, vx, vy, gravity: 0.38, ...template, sliced: false, rotation: Math.random() * Math.PI, armor: template.armor || 1 });
        }

        function createEffects(x, y, color, isCrit) {
            let ringColor = '#00ffcc';
            if (currentBlade === 'inferno') ringColor = '#ff3300';
            if (currentBlade === 'void') ringColor = '#bf00ff';
            if (currentBlade === 'rainbow') ringColor = '#ff00aa';

            fxRings.push({ x, y, radius: 10, maxRadius: isCrit ? 100 : 60, alpha: 1, color: ringColor });

            for (let i = 0; i < 28; i++) {
                juiceSplashes.push({
                    x, y, vx: (Math.random() - 0.5) * 18, vy: (Math.random() - 0.5) * 18,
                    radius: Math.random() * 5 + 2, color, alpha: 1, gravity: 0.42, isDrop: true
                });
            }
            for (let i = 0; i < 5; i++) {
                juiceSplashes.push({
                    x: x + (Math.random() - 0.5) * 60, y: y + (Math.random() - 0.5) * 60,
                    radius: Math.random() * 14 + 8, color, alpha: 0.75, isDrop: false
                });
            }
            for (let i = 0; i < 12; i++) {
                debrisList.push({
                    x, y, vx: (Math.random() - 0.5) * 14, vy: (Math.random() - 0.5) * 14,
                    size: Math.random() * 6 + 2, color: Math.random() > 0.4 ? color : ringColor, alpha: 1, gravity: 0.5
                });
            }
        }

        function createHalvedFruit(f) {
            halvedFruits.push({
                x: f.x, y: f.y, vx: -6, vy: -6.5, gravity: 0.42,
                rotation: f.rotation, vRot: -0.22, ...f, side: 'left', alpha: 1
            });
            halvedFruits.push({
                x: f.x, y: f.y, vx: 6, vy: -6.5, gravity: 0.42,
                rotation: f.rotation, vRot: 0.22, ...f, side: 'right', alpha: 1
            });
        }

        function checkSlice(x, y) {
            let slicedCount = 0;
            let hasCrit = false;

            fruits.forEach(f => {
                if (!f.sliced) {
                    let dist = Math.hypot(f.x - x, f.y - y);
                    if (dist < f.radius + 18) {
                        if (f.isBomb) {
                            lives = 0; updateLivesUI(); gameOver();
                        } else if (f.armor > 1) {
                            // Dừa giáp cứng cần chém tiếp
                            f.armor--;
                            playSound('slice');
                            createEffects(f.x, f.y, '#b5838d', false);
                            hitStopFrames = 2;
                            screenShakeFrames = 4;
                            showPopup("🥥 GIÁP VỠ!", "#fff");
                        } else {
                            f.sliced = true;
                            slicedCount++;
                            let isCrit = Math.random() < 0.22;
                            if (isCrit) hasCrit = true;

                            if (f.isFrenzy) {
                                frenzyTimer = 300; // 5 giây cuồng nộ
                                slowMoFrames = 120;
                                playSound('frenzy');
                                showPopup("🍌 BANANA FRENZY!", "#ffcc00");
                            } else {
                                playSound(isCrit ? 'crit' : 'slice');
                            }

                            createEffects(f.x, f.y, f.inner, isCrit);
                            createHalvedFruit(f);
                            hitStopFrames = isCrit ? 6 : 3;
                            screenShakeFrames = isCrit ? 14 : 6;
                            flashAlpha = isCrit ? 0.45 : 0.15;

                            score += isCrit ? f.points * 5 : f.points;
                            if (isCrit) showPopup("⚡ CRITICAL! +X5", "#ff3366");
                        }
                    }
                }
            });

            if (slicedCount >= 2 && !hasCrit) {
                showPopup(`🔥 COMBO x${slicedCount}!`);
                score += slicedCount * 4;
            }
        }

        function update() {
            if (!isPlaying) return;
            if (slowMoFrames > 0) slowMoFrames--;
            if (hitStopFrames > 0) { hitStopFrames--; return; }

            if (frenzyTimer > 0) frenzyTimer--;

            let spawnRate = frenzyTimer > 0 ? 15 : 36;
            spawnTimer++;
            if (spawnTimer > spawnRate) {
                spawnTimer = 0;
                spawnFruit();
                if (Math.random() > 0.4 || frenzyTimer > 0) spawnFruit();
            }

            let speedFactor = slowMoFrames > 0 ? 0.5 : 1.0;

            for (let i = fruits.length - 1; i >= 0; i--) {
                let f = fruits[i];
                f.x += f.vx * speedFactor; f.y += f.vy * speedFactor; f.vy += f.gravity * speedFactor; f.rotation += 0.03 * speedFactor;
                if (f.y > canvas.height + 60) {
                    if (!f.sliced && !f.isBomb) {
                        lives--; updateLivesUI();
                        if (lives <= 0) gameOver();
                    }
                    fruits.splice(i, 1);
                }
            }

            for (let i = halvedFruits.length - 1; i >= 0; i--) {
                let h = halvedFruits[i];
                h.x += h.vx * speedFactor; h.y += h.vy * speedFactor; h.vy += h.gravity * speedFactor;
                h.rotation += h.vRot * speedFactor; h.alpha -= 0.02;
                if (h.alpha <= 0 || h.y > canvas.height + 60) halvedFruits.splice(i, 1);
            }

            for (let i = juiceSplashes.length - 1; i >= 0; i--) {
                let s = juiceSplashes[i];
                if (s.isDrop) {
                    s.x += s.vx * speedFactor; s.y += s.vy * speedFactor; s.vy += s.gravity * speedFactor; s.alpha -= 0.025;
                } else {
                    s.alpha -= 0.0025;
                }
                if (s.alpha <= 0) juiceSplashes.splice(i, 1);
            }

            for (let i = fxRings.length - 1; i >= 0; i--) {
                let r = fxRings[i];
                r.radius += 6;
                r.alpha -= 0.05;
                if (r.alpha <= 0) fxRings.splice(i, 1);
            }

            for (let i = debrisList.length - 1; i >= 0; i--) {
                let d = debrisList[i];
                d.x += d.vx * speedFactor; d.y += d.vy * speedFactor; d.vy += d.gravity * speedFactor; d.alpha -= 0.03;
                if (d.alpha <= 0) debrisList.splice(i, 1);
            }

            sliceTrail.forEach(t => t.alpha -= 0.12);
            sliceTrail = sliceTrail.filter(t => t.alpha > 0);
            document.getElementById("score").innerText = score;
        }

        function drawFruitShape(ctx, f, isHalf = false, side = 'left') {
            ctx.save();
            ctx.translate(f.x, f.y);
            ctx.rotate(f.rotation);

            if (!isHalf) {
                ctx.fillStyle = f.isBomb ? '#1a1a1a' : f.outer;
                ctx.beginPath(); ctx.arc(0, 0, f.radius, 0, Math.PI * 2); ctx.fill();
                ctx.lineWidth = f.armor > 1 ? 5 : 3.5;
                ctx.strokeStyle = f.armor > 1 ? '#ffcc00' : 'rgba(0,0,0,0.4)';
                ctx.stroke();

                if (!f.isBomb) {
                    ctx.fillStyle = 'rgba(255,255,255,0.25)';
                    ctx.beginPath(); ctx.arc(-f.radius*0.35, -f.radius*0.35, f.radius*0.3, 0, Math.PI*2); ctx.fill();
                } else {
                    ctx.fillStyle = '#ff3366'; ctx.beginPath(); ctx.arc(0, -f.radius*0.65, 7, 0, Math.PI*2); ctx.fill();
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(0, -f.radius*0.65); ctx.lineTo(12, -f.radius-12); ctx.stroke();
                }
            } else {
                ctx.beginPath();
                if (side === 'left') {
                    ctx.arc(0, 0, f.radius, Math.PI * 0.5, Math.PI * 1.5);
                } else {
                    ctx.arc(0, 0, f.radius, Math.PI * 1.5, Math.PI * 0.5);
                }
                ctx.closePath();
                
                ctx.fillStyle = f.outer; ctx.fill();
                ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.stroke();

                ctx.fillStyle = f.inner;
                ctx.beginPath();
                if (side === 'left') {
                    ctx.arc(0, 0, f.radius - 5, Math.PI * 0.5, Math.PI * 1.5);
                } else {
                    ctx.arc(0, 0, f.radius - 5, Math.PI * 1.5, Math.PI * 0.5);
                }
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = f.seed;
                ctx.beginPath(); ctx.arc(side === 'left' ? -7 : 7, 0, 3.5, 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();
        }

        function draw() {
            ctx.save();
            if (screenShakeFrames > 0) {
                screenShakeFrames--;
                ctx.translate((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 12);
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Hiệu ứng nền khi kích hoạt Frenzy
            if (frenzyTimer > 0) {
                ctx.fillStyle = 'rgba(255, 100, 0, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            juiceSplashes.forEach(s => {
                if (!s.isDrop) {
                    ctx.save(); ctx.globalAlpha = s.alpha; ctx.fillStyle = s.color;
                    ctx.beginPath(); ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();
                }
            });

            fxRings.forEach(r => {
                ctx.save(); ctx.globalAlpha = r.alpha; ctx.strokeStyle = r.color; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2); ctx.stroke();
                ctx.restore();
            });

            fruits.forEach(f => drawFruitShape(ctx, f));

            halvedFruits.forEach(h => {
                ctx.save(); ctx.globalAlpha = h.alpha;
                drawFruitShape(ctx, h, true, h.side);
                ctx.restore();
            });

            juiceSplashes.forEach(s => {
                if (s.isDrop) {
                    ctx.save(); ctx.globalAlpha = s.alpha; ctx.fillStyle = s.color;
                    ctx.beginPath(); ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();
                }
            });
            debrisList.forEach(d => {
                ctx.save(); ctx.globalAlpha = d.alpha; ctx.fillStyle = d.color;
                ctx.fillRect(d.x, d.y, d.size, d.size);
                ctx.restore();
            });

            // Vết kiếm tùy biến theo Lưỡi Kiếm (Blade Styles)
            if (sliceTrail.length > 1) {
                let color = "#00ffcc", shadow = "#00ffcc";
                if (currentBlade === 'inferno') { color = "#ff3300"; shadow = "#ff6600"; }
                if (currentBlade === 'void') { color = "#bf00ff"; shadow = "#da70d6"; }
                if (currentBlade === 'rainbow') { color = `hsl(${Date.now() % 360}, 100%, 50%)`; shadow = "#fff"; }

                ctx.strokeStyle = color;
                ctx.lineWidth = 9; ctx.lineCap = "round"; ctx.lineJoin = "round";
                ctx.shadowColor = shadow;
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.moveTo(sliceTrail[0].x, sliceTrail[0].y);
                for (let i = 1; i < sliceTrail.length; i++) {
                    ctx.lineTo(sliceTrail[i].x, sliceTrail[i].y);
                }
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            if (flashAlpha > 0) {
                ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                flashAlpha -= 0.08;
            }

            ctx.restore();
        }

        function loop() {
            if (!isPlaying) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
