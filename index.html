<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chặt Trái Cây Đỉnh Cao</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
</head>
<body>
{
            background: #020308;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            font-size: 1.15rem;
            margin-bottom: 5px;
            background: linear-gradient(45deg, #00f2fe, #4facfe, #ff0844, #ffb199);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 900;
        }
        #game-container {
            position: relative;
            width: 750px;
            height: 600px;
            background: #0a0e17;
            border: 4px solid #1e293b;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 100px rgba(0, 242, 254, 0.25), 0 30px 60px rgba(0,0,0,0.9);
            cursor: crosshair;
        }
        canvas {
            display: block;
            background: radial-gradient(circle at center, #131c31 0%, #05070d 100%);
        }

        .ui-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(13, 22, 38, 0.96) 0%, rgba(5, 7, 13, 0.99) 100%);
            backdrop-filter: blur(14px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 25px;
            z-index: 10;
        }

        /* Lobby Animations & Styling */
        .lobby-bg-glow {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(0,242,254,0.18) 0%, rgba(255,8,68,0.08) 50%, transparent 70%);
            border-radius: 50%;
            animation: pulseLobby 4s ease-in-out infinite alternate;
            z-index: -1;
            pointer-events: none;
        }
        @keyframes pulseLobby {
            0% { transform: scale(0.9); opacity: 0.6; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        .logo-badge {
            font-size: 3.5rem;
            margin-bottom: 6px;
            animation: floatLogo 2s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 30px rgba(0, 242, 254, 0.8));
        }
        @keyframes floatLogo {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-10px) scale(1.07); }
        }
        .ui-screen h2 {
            font-size: 1.9rem;
            margin-bottom: 6px;
            background: linear-gradient(45deg, #00f2fe, #ff0844);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 15px rgba(0, 242, 254, 0.3);
            font-weight: 900;
        }
        .ui-screen p {
            margin-bottom: 18px;
            color: #94a3b8;
            font-size: 0.88rem;
            line-height: 1.5;
            max-width: 440px;
        }

        .blade-picker {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .blade-opt {
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid #334155;
            color: #cbd5e1;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 0.82rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .blade-opt:hover { border-color: #00f2fe; color: #fff; }
        .blade-opt.active {
            border-color: #00f2fe;
            background: rgba(0, 242, 254, 0.2);
            color: #00f2fe;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.5);
            transform: scale(1.05);
        }

        .btn {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #05070d;
            border: none;
            padding: 13px 42px;
            font-size: 1.05rem;
            font-weight: 900;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 242, 254, 0.45);
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s ease;
        }
        .btn:hover { transform: scale(1.08); box-shadow: 0 12px 35px rgba(0, 242, 254, 0.75); }

        #scoreboard {
            position: absolute;
            top: 15px; left: 20px; right: 20px;
            display: flex; justify-content: space-between;
            font-size: 1.1rem; font-weight: bold; z-index: 5; pointer-events: none;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }
        .lives { color: #ff3366; font-size: 1.2rem; }
        #popup-msg {
            position: absolute; top: 75px; width: 100%; text-align: center;
            font-size: 1.8rem; font-weight: 900; color: #00f2fe;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.9);
            z-index: 6; pointer-events: none; opacity: 0;
            transform: scale(0.5);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.4);
        }
    </style>
</head>
<body>

    <h1>⚡ Fruit Ninja: Elemental God & Boss Rush (Deluxe Lobby) 🌀</h1>
    
    <div id="game-container">
        <div id="scoreboard">
            <div>Điểm: <span id="score" style="color:#00f2fe;">0</span> | Kỷ lục: <span id="highscore" style="color:#ffcc00;">0</span></div>
            <div class="lives"><span id="lives">❤️❤️❤️</span></div>
        </div>
        <div id="popup-msg"></div>

        <canvas id="gameCanvas" width="750" height="600"></canvas>

        <!-- SẢNH CHỜ (DELUXE LOBBY) -->
        <div id="start-screen" class="ui-screen">
            <div class="lobby-bg-glow"></div>
            <div class="logo-badge">⚡❄️⚔️</div>
            <h2>DELUXE LOBBY ARENA</h2>
            <p>Chọn hệ năng lượng cho lưỡi kiếm của bạn trước khi bước vào trận chiến đối đầu Titan Boss và Sấm Sét tối thượng!</p>
            
            <div class="blade-picker">
                <button class="blade-opt active" onclick="setBladeStyle('neon', this)">⚡ Quantum Cyan</button>
                <button class="blade-opt" onclick="setBladeStyle('inferno', this)">🔥 Magma Inferno</button>
                <button class="blade-opt" onclick="setBladeStyle('void', this)">💜 Void Stalker</button>
            </div>

            <button class="btn" onclick="startGame()">BẮT ĐẦU CHIẾN ĐẤU</button>
        </div>

        <div id="gameover-screen" class="ui-screen" style="display: none;">
            <div class="logo-badge">💥</div>
            <h2>GAME OVER</h2>
            <p>Điểm số đạt được: <span id="final-score" style="color:#fff; font-size:1.3rem; font-weight:bold;">0</span><br>Kỷ lục cao nhất: <span id="final-highscore" style="color:#ffcc00; font-size:1.3rem; font-weight:bold;">0</span></p>
            <button class="btn" onclick="startGame()">CHƠI LẠI</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let activeBlade = 'neon';
        function setBladeStyle(style, btn) {
            activeBlade = style;
            document.querySelectorAll('.blade-opt').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        let audioCtx = null;
        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                if (type === 'slice') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(450, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1300, audioCtx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.08);
                } else if (type === 'lightning') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(900, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
                } else if (type === 'freeze') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                } else if (type === 'bomb') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(20, audioCtx.currentTime + 0.5);
                    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.5);
                }
            } catch(e) {}
        }

        let score = 0, highscore = localStorage.getItem("fruit_ninja_lobby_hs") || 0;
        document.getElementById("highscore").innerText = highscore;

        let lives = 3, isPlaying = false;
        let fruits = [], halvedFruits = [], juiceSplashes = [], sliceTrail = [], fxRings = [], lightningBeams = [];
        let spawnTimer = 0, hitStopFrames = 0, screenShakeFrames = 0, flashAlpha = 0;
        let freezeTimer = 0, bossActive = false, bossObj = null;

        const fruitTypes = [
            { type: 'watermelon', radius: 35, points: 1, outer: '#1b4332', inner: '#d90429', seed: '#111' },
            { type: 'apple', radius: 27, points: 1, outer: '#d90429', inner: '#ffb703', seed: '#3d2314' },
            { type: 'orange', radius: 29, points: 2, outer: '#f77f00', inner: '#fcbf49', seed: '#fff' },
            { type: 'lightning', radius: 26, points: 5, outer: '#00f2fe', inner: '#ffffff', seed: '#00f2fe', isLightning: true },
            { type: 'freeze', radius: 26, points: 5, outer: '#4facfe', inner: '#e0f7fa', seed: '#0288d1', isFreeze: true },
            { type: 'bomb', radius: 28, isBomb: true }
        ];

        let isDragging = false;
        function addPoint(x, y) {
            sliceTrail.push({ x, y, alpha: 1 });
            if (sliceTrail.length > 15) sliceTrail.shift();
        }

        canvas.addEventListener("mousedown", (e) => {
            isDragging = true;
            let rect = canvas.getBoundingClientRect();
            addPoint(e.clientX - rect.left, e.clientY - rect.top);
        });
        canvas.addEventListener("mousemove", (e) => {
            if (!isDragging || !isPlaying) return;
            let rect = canvas.getBoundingClientRect();
            let x = e.clientX - rect.left, y = e.clientY - rect.top;
            addPoint(x, y);
            checkSlice(x, y);
        });
        window.addEventListener("mouseup", () => { isDragging = false; });

        canvas.addEventListener("touchstart", (e) => {
            isDragging = true;
            let rect = canvas.getBoundingClientRect();
            let x = e.touches[0].clientX - rect.left, y = e.touches[0].clientY - rect.top;
            addPoint(x, y); e.preventDefault();
        });
        canvas.addEventListener("touchmove", (e) => {
            if (!isDragging || !isPlaying) return;
            let rect = canvas.getBoundingClientRect();
            let x = e.touches[0].clientX - rect.left, y = e.touches[0].clientY - rect.top;
            addPoint(x, y); checkSlice(x, y); e.preventDefault();
        });
        canvas.addEventListener("touchend", () => { isDragging = false; });

        function startGame() {
            document.getElementById("start-screen").style.display = "none";
            document.getElementById("gameover-screen").style.display = "none";
            score = 0; lives = 3; fruits = []; halvedFruits = []; juiceSplashes = []; fxRings = []; lightningBeams = [];
            spawnTimer = 0; hitStopFrames = 0; screenShakeFrames = 0; flashAlpha = 0;
            freezeTimer = 0; bossActive = false; bossObj = null;
            isPlaying = true;
            updateLivesUI();
            loop();
        }

        function gameOver() {
            isPlaying = false;
            playSound('bomb');
            screenShakeFrames = 25;
            flashAlpha = 0.85;
            if (score > highscore) {
                highscore = score;
                localStorage.setItem("fruit_ninja_lobby_hs", highscore);
                document.getElementById("highscore").innerText = highscore;
            }
            document.getElementById("final-score").innerText = score;
            document.getElementById("final-highscore").innerText = highscore;
            document.getElementById("gameover-screen").style.display = "flex";
        }

        function updateLivesUI() {
            let h = ""; for (let i = 0; i < lives; i++) h += "❤";
            document.getElementById("lives").innerText = h;
        }

        function showPopup(text, color = "#00f2fe") {
            let el = document.getElementById("popup-msg");
            el.innerText = text;
            el.style.color = color;
            el.style.opacity = "1";
            el.style.transform = "scale(1.4)";
            setTimeout(() => { el.style.opacity = "0"; el.style.transform = "scale(0.8)"; }, 700);
        }

        function spawnFruit() {
            if (!bossActive && score > 0 && score % 40 === 0 && !bossObj) {
                bossObj = { x: canvas.width / 2, y: canvas.height + 60, vx: 0, vy: -10, gravity: 0.25, radius: 65, hp: 6, maxHp: 6, rotation: 0, isBoss: true, sliced: false };
                fruits.push(bossObj);
                showPopup("⚠️ WATERMELON TITAN XUẤT HIỆN!", "#ff3366");
                playSound('lightning');
                return;
            }

            let template = fruitTypes[Math.floor(Math.random() * fruitTypes.length)];
            if (template.isBomb && Math.random() > 0.2) template = fruitTypes[0];
            
            let x = Math.random() * (canvas.width - 160) + 80;
            let vx = (canvas.width / 2 - x) * 0.02 + (Math.random() - 0.5) * 3.5;
            let vy = -Math.random() * 4 - 12;
            fruits.push({ x, y: canvas.height + 50, vx, vy, gravity: 0.38, ...template, sliced: false, rotation: Math.random() * Math.PI });
        }

        function triggerLightning(startX, startY) {
            playSound('lightning');
            flashAlpha = 0.6;
            screenShakeFrames = 15;
            showPopup("⚡ LIGHTNING STORM!", "#00f2fe");

            fruits.forEach(f => {
                if (!f.sliced && !f.isBomb) {
                    f.sliced = true;
                    lightningBeams.push({ x1: startX, y1: startY, x2: f.x, y2: f.y, alpha: 1 });
                    score += 3;
                }
            });
        }

        function triggerFreeze() {
            playSound('freeze');
            freezeTimer = 250;
            flashAlpha = 0.4;
            showPopup("❄️ FROST TIME FREEZE!", "#4facfe");
        }

        function checkSlice(x, y) {
            fruits.forEach(f => {
                if (!f.sliced) {
                    let dist = Math.hypot(f.x - x, f.y - y);
                    if (dist < f.radius + 18) {
                        if (f.isBomb) {
                            lives = 0; updateLivesUI(); gameOver();
                        } else if (f.isBoss) {
                            f.hp--;
                            playSound('slice');
                            screenShakeFrames = 6;
                            showPopup(`🛡️ TITAN HP: ${f.hp}/${f.maxHp}`, "#ff3366");
                            if (f.hp <= 0) {
                                f.sliced = true;
                                bossObj = null;
                                score += 30;
                                showPopup("👑 HẠ GỤC TITAN BOSS! +30", "#ffcc00");
                                flashAlpha = 0.7;
                            }
                        } else {
                            f.sliced = true;
                            if (f.isLightning) triggerLightning(f.x, f.y);
                            else if (f.isFreeze) triggerFreeze();
                            else playSound('slice');

                            score += f.points;
                            hitStopFrames = 3;
                            screenShakeFrames = 5;
                        }
                    }
                }
            });
        }

        function update() {
            if (!isPlaying) return;
            if (hitStopFrames > 0) { hitStopFrames--; return; }

            if (freezeTimer > 0) freezeTimer--;
            let speedFactor = freezeTimer > 0 ? 0.35 : 1.0;

            spawnTimer++;
            if (spawnTimer > 38) {
                spawnTimer = 0;
                spawnFruit();
                if (Math.random() > 0.45) spawnFruit();
            }

            for (let i = fruits.length - 1; i >= 0; i--) {
                let f = fruits[i];
                f.x += f.vx * speedFactor; f.y += f.vy * speedFactor; f.vy += f.gravity * speedFactor; f.rotation += 0.03 * speedFactor;
                if (f.y > canvas.height + 70) {
                    if (!f.sliced && !f.isBomb) {
                        lives--; updateLivesUI();
                        if (lives <= 0) gameOver();
                    }
                    if (f.isBoss) bossObj = null;
                    fruits.splice(i, 1);
                }
            }

            lightningBeams.forEach(b => b.alpha -= 0.1);
            lightningBeams = lightningBeams.filter(b => b.alpha > 0);

            sliceTrail.forEach(t => t.alpha -= 0.12);
            sliceTrail = sliceTrail.filter(t => t.alpha > 0);
            document.getElementById("score").innerText = score;
        }

        function draw() {
            ctx.save();
            if (screenShakeFrames > 0) {
                screenShakeFrames--;
                ctx.translate((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (freezeTimer > 0) {
                ctx.fillStyle = 'rgba(79, 172, 254, 0.08)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            lightningBeams.forEach(b => {
                ctx.save();
                ctx.globalAlpha = b.alpha;
                ctx.strokeStyle = '#00f2fe';
                ctx.lineWidth = 5;
                ctx.shadowColor = '#00f2fe';
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.moveTo(b.x1, b.y1);
                ctx.lineTo(b.x2, b.y2);
                ctx.stroke();
                ctx.restore();
            });

            fruits.forEach(f => {
                ctx.save();
                ctx.translate(f.x, f.y);
                ctx.rotate(f.rotation);

                if (f.isBoss) {
                    ctx.fillStyle = '#0f172a';
                    ctx.beginPath(); ctx.arc(0, 0, f.radius, 0, Math.PI * 2); ctx.fill();
                    ctx.lineWidth = 6; ctx.strokeStyle = '#ff3366'; ctx.stroke();
                    ctx.fillStyle = '#d90429';
                    ctx.beginPath(); ctx.arc(0, 0, f.radius - 10, 0, Math.PI * 2); ctx.fill();
                } else {
                    ctx.fillStyle = f.isBomb ? '#1a1a1a' : f.outer;
                    ctx.beginPath(); ctx.arc(0, 0, f.radius, 0, Math.PI * 2); ctx.fill();
                    ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.stroke();

                    if (f.isLightning) {
                        ctx.fillStyle = '#ffffff';
                        ctx.font = '22px sans-serif';
                        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.fillText('⚡', 0, 0);
                    } else if (f.isFreeze) {
                        ctx.fillStyle = '#ffffff';
                        ctx.font = '22px sans-serif';
                        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.fillText('❄️', 0, 0);
                    } else if (!f.isBomb) {
                        ctx.fillStyle = 'rgba(255,255,255,0.25)';
                        ctx.beginPath(); ctx.arc(-f.radius*0.35, -f.radius*0.35, f.radius*0.3, 0, Math.PI*2); ctx.fill();
                    } else {
                        ctx.fillStyle = '#ff3366'; ctx.beginPath(); ctx.arc(0, -f.radius*0.65, 7, 0, Math.PI*2); ctx.fill();
                        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(0, -f.radius*0.65); ctx.lineTo(12, -f.radius-12); ctx.stroke();
                    }
                }
                ctx.restore();
            });

            // Vệt kiếm thay đổi linh hoạt theo Sảnh Chờ
            if (sliceTrail.length > 1) {
                let color = "#00f2fe", shadow = "#4facfe";
                if (activeBlade === 'inferno') { color = "#ff3300"; shadow = "#ff6600"; }
                if (activeBlade === 'void') { color = "#bf00ff"; shadow = "#da70d6"; }

                ctx.strokeStyle = color;
                ctx.lineWidth = 8; ctx.lineCap = "round"; ctx.lineJoin = "round";
                ctx.shadowColor = shadow;
                ctx.shadowBlur = 18;
                ctx.beginPath();
                ctx.moveTo(sliceTrail[0].x, sliceTrail[0].y);
                for (let i = 1; i < sliceTrail.length; i++) {
                    ctx.lineTo(sliceTrail[i].x, sliceTrail[i].y);
                }
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            if (flashAlpha > 0) {
                ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                flashAlpha -= 0.08;
            }

            ctx.restore();
        }

        function loop() {
            if (!isPlaying) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
