<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chặt Trái Cây Đỉnh Cao</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
</head>
<body>
{
            background: #05070c;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            font-size: 1.6rem;
            margin-bottom: 5px;
            background: linear-gradient(45deg, #f43f5e, #fbbf24, #38bdf8, #c084fc, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            background: #111827;
            border: 4px solid #374151;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            cursor: crosshair;
        }
        canvas {
            display: block;
            background: radial-gradient(circle, #1f2937 0%, #0b0f19 100%);
        }
        .ui-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            z-index: 10;
        }
        .ui-screen h2 {
            font-size: 2rem;
            margin-bottom: 12px;
            color: #fbbf24;
            text-shadow: 0 0 15px rgba(251, 191, 36, 0.6);
        }
        .ui-screen p {
            margin-bottom: 20px;
            color: #9ca3af;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        .btn {
            background: linear-gradient(45deg, #f43f5e, #fbbf24);
            color: #05070c;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(244, 63, 94, 0.5);
        }
        .btn:hover {
            transform: scale(1.06);
            opacity: 0.9;
        }
        #scoreboard {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: bold;
            z-index: 5;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .lives {
            color: #f43f5e;
        }
        #combo-popup {
            position: absolute;
            top: 75px;
            width: 100%;
            text-align: center;
            font-size: 1.6rem;
            font-weight: 900;
            color: #38bdf8;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.9);
            z-index: 6;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #active-effects {
            position: absolute;
            top: 45px;
            left: 15px;
            font-size: 0.8rem;
            color: #38bdf8;
            z-index: 5;
            pointer-events: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>🍉 Chặt Trái Cây Đỉnh Cao - Ultimate</h1>
    
    <div id="game-container">
        <div id="scoreboard">
            <div>Điểm: <span id="score">0</span></div>
            <div class="lives">Mạng: <span id="lives">❤️❤️❤️</span></div>
        </div>
        <div id="active-effects"></div>
        <div id="combo-popup"></div>

        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <!-- Màn hình Bắt đầu -->
        <div id="start-screen" class="ui-screen">
            <h2>Bùng Nổ Tột Đỉnh!</h2>
            <p>Tránh <b>Bom (💣)</b>. Chém trái cây để thấy <b>hiệu ứng chẻ đôi</b> và kích hoạt <b>Siêu Bùng Nổ (Super Nova)</b> quét sạch bản đồ!</p>
            <button class="btn" onclick="startGame()">BẮT ĐẦU NGAY</button>
        </div>

        <!-- Màn hình Thua cuộc -->
        <div id="gameover-screen" class="ui-screen" style="display: none;">
            <h2>💥 KẾT THÚC TRÒ CHƠI</h2>
            <p>Điểm số vinh quang: <span id="final-score">0</span></p>
            <button class="btn" onclick="startGame()">CHƠI LẠI</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Web Audio API
        let audioCtx = null;
        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'slice') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(350, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'bomb') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(130, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(25, audioCtx.currentTime + 0.5);
                    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.5);
                } else if (type === 'nova') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.6);
                    gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.6);
                }
            } catch(e) {}
        }

        let score = 0;
        let lives = 3;
        let isPlaying = false;
        let fruits = [];
        let halvedFruits = []; // Danh sách các nửa trái cây bị chẻ đôi
        let particles = [];
        let sliceTrail = [];
        let spawnTimer = 0;
        
        let doublePointsTimer = 0;
        let freezeTimer = 0;
        let frenzyTimer = 0;
        let superNovaFlash = 0; // Hiệu ứng lóe sáng bùng nổ cuối cùng

        const fruitTypes = [
            { name: 'Watermelon', emoji: '🍉', radius: 34, points: 1 },
            { name: 'Apple', emoji: '🍎', radius: 27, points: 1 },
            { name: 'Orange', emoji: '🍊', radius: 29, points: 2 },
            { name: 'Grape', emoji: '🍇', radius: 25, points: 3 },
            { name: 'FreezeBanana', emoji: '🍌❄️', radius: 30, isFreeze: true },
            { name: 'DoublePineapple', emoji: '🍍✨', radius: 31, isDouble: true },
            { name: 'SuperNova', emoji: '💥🌟', radius: 33, isNova: true },
            { name: 'Bomb', emoji: '💣', radius: 30, isBomb: true }
        ];

        let isDragging = false;

        function addPoint(x, y) {
            sliceTrail.push({ x, y, alpha: 1 });
            if (sliceTrail.length > 12) sliceTrail.shift();
        }

        canvas.addEventListener("mousedown", (e) => {
            isDragging = true;
            let rect = canvas.getBoundingClientRect();
            addPoint(e.clientX - rect.left, e.clientY - rect.top);
        });

        canvas.addEventListener("mousemove", (e) => {
            if (!isDragging || !isPlaying) return;
            let rect = canvas.getBoundingClientRect();
            let x = e.clientX - rect.left;
            let y = e.clientY - rect.top;
            addPoint(x, y);
            checkSlice(x, y);
        });

        window.addEventListener("mouseup", () => {
            isDragging = false;
            sliceTrail = [];
        });

        canvas.addEventListener("touchstart", (e) => {
            isDragging = true;
            let rect = canvas.getBoundingClientRect();
            let x = e.touches[0].clientX - rect.left;
            let y = e.touches[0].clientY - rect.top;
            addPoint(x, y);
            e.preventDefault();
        });

        canvas.addEventListener("touchmove", (e) => {
            if (!isDragging || !isPlaying) return;
            let rect = canvas.getBoundingClientRect();
            let x = e.touches[0].clientX - rect.left;
            let y = e.touches[0].clientY - rect.top;
            addPoint(x, y);
            checkSlice(x, y);
            e.preventDefault();
        });

        canvas.addEventListener("touchend", () => {
            isDragging = false;
            sliceTrail = [];
        });

        function startGame() {
            document.getElementById("start-screen").style.display = "none";
            document.getElementById("gameover-screen").style.display = "none";
            score = 0;
            lives = 3;
            fruits = [];
            halvedFruits = [];
            particles = [];
            spawnTimer = 0;
            doublePointsTimer = 0;
            freezeTimer = 0;
            frenzyTimer = 0;
            superNovaFlash = 0;
            isPlaying = true;
            updateLivesUI();
            loop();
        }

        function gameOver() {
            isPlaying = false;
            playSound('bomb');
            document.getElementById("final-score").innerText = score;
            document.getElementById("gameover-screen").style.display = "flex";
        }

        function updateLivesUI() {
            let hearts = "";
            for (let i = 0; i < lives; i++) hearts += "❤️";
            document.getElementById("lives").innerText = hearts;
        }

        function showCombo(text) {
            let el = document.getElementById("combo-popup");
            el.innerText = text;
            el.style.opacity = "1";
            el.style.transform = "scale(1.2)";
            setTimeout(() => { 
                el.style.opacity = "0"; 
                el.style.transform = "scale(0.8)";
            }, 900);
        }

        function spawnFruit() {
            let type = fruitTypes[Math.floor(Math.random() * fruitTypes.length)];
            if ((type.isBomb || type.isFreeze || type.isDouble || type.isNova) && Math.random() > 0.4) {
                type = fruitTypes[0];
            }

            let x = Math.random() * (canvas.width - 100) + 50;
            let vx = (canvas.width / 2 - x) * 0.02 + (Math.random() - 0.5) * 2;
            let vy = -Math.random() * 4 - 11;

            if (frenzyTimer > 0) vy -= 3.5;

            fruits.push({
                x: x,
                y: canvas.height + 40,
                vx: vx,
                vy: vy,
                gravity: 0.35,
                ...type,
                sliced: false
            });
        }

        function createParticles(x, y) {
            for (let i = 0; i < 14; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    radius: Math.random() * 5 + 2,
                    color: ['#f43f5e', '#fbbf24', '#38bdf8', '#c084fc', '#4ade80'][Math.floor(Math.random()*5)],
                    alpha: 1
                });
            }
        }

        // Tạo hiệu ứng hai nửa trái cây văng ra khi bị chém
        function createHalvedFruit(x, y, emoji) {
            halvedFruits.push({
                x: x,
                y: y,
                vx: -3,
                vy: -5,
                gravity: 0.4,
                rotation: 0,
                vRot: -0.1,
                emoji: emoji,
                alpha: 1,
                side: 'left'
            });
            halvedFruits.push({
                x: x,
                y: y,
                vx: 3,
                vy: -5,
                gravity: 0.4,
                rotation: 0,
                vRot: 0.1,
                emoji: emoji,
                alpha: 1,
                side: 'right'
            });
        }

        function checkSlice(x, y) {
            let slicedCount = 0;
            fruits.forEach(f => {
                if (!f.sliced) {
                    let dist = Math.hypot(f.x - x, f.y - y);
                    if (dist < f.radius + 18) {
                        f.sliced = true;
                        slicedCount++;

                        if (f.isBomb) {
                            lives = 0;
                            updateLivesUI();
                            gameOver();
                        } else {
                            playSound('slice');
                            createParticles(f.x, f.y);
                            createHalvedFruit(f.x, f.y, f.emoji);

                            let pts = f.points || 1;
                            if (doublePointsTimer > 0) pts *= 2;

                            if (f.isFreeze) {
                                freezeTimer = 300; 
                                showCombo("❄️ THỜI GIAN ĐÓNG BĂNG!");
                            } else if (f.isDouble) {
                                doublePointsTimer = 300; 
                                showCombo("🍍 ĐIỂM SỐ NHÂN ĐÔI!");
                            } else if (f.isNova) {
                                // BÙNG NỔ CUỐI CÙNG (SUPER NOVA)
                                playSound('nova');
                                superNovaFlash = 25; // Lóa sáng màn hình
                                fruits.forEach(other => {
                                    if (!other.sliced && !other.isBomb) {
                                        other.sliced = true;
                                        score += (other.points || 1) * 3;
                                        createParticles(other.x, other.y);
                                        createHalvedFruit(other.x, other.y, other.emoji);
                                    }
                                });
                                showCombo("💥 SUPER NOVA BÙNG NỔ TỘT ĐỈNH! 💥");
                            }

                            score += pts;
                        }
                    }
                }
            });

            if (slicedCount >= 2 && slicedCount < 4) {
                showCombo(`🔥 COMBO x${slicedCount}!`);
                score += slicedCount * 2;
            } else if (slicedCount >= 4) {
                showCombo(`👑 MASTER LEGEND x${slicedCount}!!`);
                score += slicedCount * 5;
            }
        }

        function update() {
            if (!isPlaying) return;

            if (freezeTimer > 0) freezeTimer--;
            if (doublePointsTimer > 0) doublePointsTimer--;
            if (frenzyTimer > 0) frenzyTimer--;
            if (superNovaFlash > 0) superNovaFlash--;

            let effectText = "";
            if (freezeTimer > 0) effectText += `❄️ Đóng băng: ${(freezeTimer/60).toFixed(1)}s  `;
            if (doublePointsTimer > 0) effectText += `🍍 x2 Điểm: ${(doublePointsTimer/60).toFixed(1)}s  `;
            if (frenzyTimer > 0) effectText += `🔥 FRENZY! `;
            document.getElementById("active-effects").innerText = effectText;

            if (score > 0 && score % 30 === 0 && frenzyTimer <= 0 && Math.random() < 0.15) {
                frenzyTimer = 250;
                showCombo("🌟 MƯA TRÁI CÂY BÙNG NỔ! 🌟");
            }

            let spawnInterval = (freezeTimer > 0) ? 75 : (frenzyTimer > 0 ? 18 : 42);
            spawnTimer++;
            if (spawnTimer > spawnInterval) {
                spawnTimer = 0;
                spawnFruit();
                if (frenzyTimer > 0 || Math.random() > 0.55) spawnFruit();
            }

            let speedFactor = (freezeTimer > 0) ? 0.35 : 1;

            // Cập nhật trái cây chính
            for (let i = fruits.length - 1; i >= 0; i--) {
                let f = fruits[i];
                f.x += f.vx * speedFactor;
                f.y += f.vy * speedFactor;
                f.vy += f.gravity * speedFactor;

                if (f.y > canvas.height + 50) {
                    if (!f.sliced && !f.isBomb) {
                        lives--;
                        updateLivesUI();
                        if (lives <= 0) gameOver();
                    }
                    fruits.splice(i, 1);
                }
            }

            // Cập nhật các nửa trái cây bị chẻ đôi
            for (let i = halvedFruits.length - 1; i >= 0; i--) {
                let h = halvedFruits[i];
                h.x += h.vx;
                h.y += h.vy;
                h.vy += h.gravity;
                h.rotation += h.vRot;
                h.alpha -= 0.02;
                if (h.alpha <= 0 || h.y > canvas.height + 50) {
                    halvedFruits.splice(i, 1);
                }
            }

            // Cập nhật hạt nước
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            sliceTrail.forEach(t => t.alpha -= 0.12);
            sliceTrail = sliceTrail.filter(t => t.alpha > 0);

            document.getElementById("score").innerText = score;
        }

        function draw() {
            if (superNovaFlash > 0) {
                ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                return;
            }

            if (frenzyTimer > 0) {
                ctx.fillStyle = "rgba(236, 72, 153, 0.2)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }

            // Vẽ trái cây nguyên vẹn
            fruits.forEach(f => {
                ctx.font = f.isBomb ? "38px Arial" : "34px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(f.emoji, f.x, f.y);
            });

            // Vẽ các nửa trái cây bị chẻ đôi văng ra
            halvedFruits.forEach(h => {
                ctx.save();
                ctx.globalAlpha = h.alpha;
                ctx.translate(h.x, h.y);
                ctx.rotate(h.rotation);
                ctx.font = "28px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(h.emoji, 0, 0);
                ctx.restore();
            });

            // Vẽ hạt nước
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Vẽ đường chém neon
            if (sliceTrail.length > 1) {
                ctx.strokeStyle = "rgba(244, 63, 94, 0.95)";
                ctx.lineWidth = 5;
                ctx.lineCap = "round";
                ctx.beginPath();
                ctx.moveTo(sliceTrail[0].x, sliceTrail[0].y);
                for (let i = 1; i < sliceTrail.length; i++) {
                    ctx.lineTo(sliceTrail[i].x, sliceTrail[i].y);
                }
                ctx.stroke();
            }
        }

        function loop() {
            if (!isPlaying) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
