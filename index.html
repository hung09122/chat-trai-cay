<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chặt Trái Cây Đỉnh Cao</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
</head>
<body>
background: #0f172a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #f43f5e, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            background: #1e293b;
            border: 4px solid #334155;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            cursor: crosshair;
        }
        canvas {
            display: block;
            background: radial-gradient(circle, #334155 0%, #0f172a 100%);
        }
        .ui-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            z-index: 10;
        }
        .ui-screen h2 {
            font-size: 2rem;
            margin-bottom: 15px;
            color: #fbbf24;
        }
        .ui-screen p {
            margin-bottom: 25px;
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .btn {
            background: linear-gradient(45deg, #f43f5e, #fbbf24);
            color: #0f172a;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.4);
        }
        .btn:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }
        #scoreboard {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: bold;
            z-index: 5;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .lives {
            color: #f43f5e;
        }
    </style>
</head>
<body>

    <h1>🍉 Chặt Trái Cây Đỉnh Cao</h1>
    
    <div id="game-container">
        <div id="scoreboard">
            <div>Điểm: <span id="score">0</span></div>
            <div class="lives">Mạng: <span id="lives">❤️❤️❤️</span></div>
        </div>

        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <!-- Màn hình Bắt đầu -->
        <div id="start-screen" class="ui-screen">
            <h2>Sẵn sàng chém trái cây?</h2>
            <p>Dùng chuột (hoặc ngón tay vuốt trên điện thoại) để cắt đứt các loại trái cây bay lên. <b>Tuyệt đối tránh chém phải BOM!</b> Nếu bỏ lỡ 3 quả sẽ thua.</p>
            <button class="btn" onclick="startGame()">BẮT ĐẦU NGAY</button>
        </div>

        <!-- Màn hình Thua cuộc -->
        <div id="gameover-screen" class="ui-screen" style="display: none;">
            <h2>💥 HẾT MẠNG!</h2>
            <p>Trò chơi kết thúc!<br>Điểm số đạt được: <span id="final-score">0</span></p>
            <button class="btn" onclick="startGame()">CHƠI LẠI</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let lives = 3;
        let isPlaying = false;
        let fruits = [];
        let particles = [];
        let sliceTrail = [];
        let spawnTimer = 0;

        // Định nghĩa các loại trái cây và bom
        const fruitTypes = [
            { name: 'Watermelon', emoji: '🍉', color: '#ef4444', radius: 35, points: 1 },
            { name: 'Apple', emoji: '🍎', color: '#dc2626', radius: 28, points: 1 },
            { name: 'Banana', emoji: '🍌', color: '#facc15', radius: 25, points: 2 },
            { name: 'Orange', emoji: '🍊', color: '#f97316', radius: 30, points: 2 },
            { name: 'Grape', emoji: '🍇', color: '#a855f7', radius: 26, points: 3 },
            { name: 'Bomb', emoji: '💣', color: '#000000', radius: 30, isBomb: true }
        ];

        // Xử lý sự kiện kéo chuột / vuốt tay để chém
        let isDragging = false;

        function addPoint(x, y) {
            sliceTrail.push({ x, y, alpha: 1 });
            if (sliceTrail.length > 10) sliceTrail.shift();
        }

        canvas.addEventListener("mousedown", (e) => {
            isDragging = true;
            let rect = canvas.getBoundingClientRect();
            addPoint(e.clientX - rect.left, e.clientY - rect.top);
        });

        canvas.addEventListener("mousemove", (e) => {
            if (!isDragging || !isPlaying) return;
            let rect = canvas.getBoundingClientRect();
            let x = e.clientX - rect.left;
            let y = e.clientY - rect.top;
            addPoint(x, y);
            checkSlice(x, y);
        });

        window.addEventListener("mouseup", () => {
            isDragging = false;
            sliceTrail = [];
        });

        // Hỗ trợ cảm ứng điện thoại
        canvas.addEventListener("touchstart", (e) => {
            isDragging = true;
            let rect = canvas.getBoundingClientRect();
            let x = e.touches[0].clientX - rect.left;
            let y = e.touches[0].clientY - rect.top;
            addPoint(x, y);
            e.preventDefault();
        });

        canvas.addEventListener("touchmove", (e) => {
            if (!isDragging || !isPlaying) return;
            let rect = canvas.getBoundingClientRect();
            let x = e.touches[0].clientX - rect.left;
            let y = e.touches[0].clientY - rect.top;
            addPoint(x, y);
            checkSlice(x, y);
            e.preventDefault();
        });

        canvas.addEventListener("touchend", () => {
            isDragging = false;
            sliceTrail = [];
        });

        function startGame() {
            document.getElementById("start-screen").style.display = "none";
            document.getElementById("gameover-screen").style.display = "none";
            score = 0;
            lives = 3;
            fruits = [];
            particles = [];
            spawnTimer = 0;
            isPlaying = true;
            updateLivesUI();
            loop();
        }

        function gameOver() {
            isPlaying = false;
            document.getElementById("final-score").innerText = score;
            document.getElementById("gameover-screen").style.display = "flex";
        }

        function updateLivesUI() {
            let hearts = "";
            for (let i = 0; i < lives; i++) hearts += "❤️";
            document.getElementById("lives").innerText = hearts;
        }

        function spawnFruit() {
            let type = fruitTypes[Math.floor(Math.random() * fruitTypes.length)];
            // Tỷ lệ xuất hiện bom thấp hơn một chút cho dễ thở
            if (type.isBomb && Math.random() > 0.4) {
                type = fruitTypes[0]; 
            }

            let x = Math.random() * (canvas.width - 100) + 50;
            let vx = (canvas.width / 2 - x) * 0.02 + (Math.random() - 0.5) * 2;
            let vy = -Math.random() * 4 - 11; // Tung lên cao

            fruits.push({
                x: x,
                y: canvas.height + 40,
                vx: vx,
                vy: vy,
                gravity: 0.35,
                ...type,
                sliced: false
            });
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    radius: Math.random() * 5 + 2,
                    color: color,
                    alpha: 1
                });
            }
        }

        function checkSlice(x, y) {
            fruits.forEach(f => {
                if (!f.sliced) {
                    let dist = Math.hypot(f.x - x, f.y - y);
                    if (dist < f.radius + 15) {
                        f.sliced = true;
                        if (f.isBomb) {
                            // Chém trúng bom -> Trừ hết mạng thua luôn
                            lives = 0;
                            updateLivesUI();
                            gameOver();
                        } else {
                            score += f.points;
                            createParticles(f.x, f.y, f.color);
                        }
                    }
                }
            });
        }

        function update() {
            if (!isPlaying) return;

            spawnTimer++;
            if (spawnTimer > 45) { // Tần suất xuất hiện trái cây
                spawnTimer = 0;
                spawnFruit();
                if (Math.random() > 0.5) spawnFruit(); // Đôi khi tung 2 quả cùng lúc
            }

            // Cập nhật vị trí trái cây
            for (let i = fruits.length - 1; i >= 0; i--) {
                let f = fruits[i];
                f.x += f.vx;
                f.y += f.vy;
                f.vy += f.gravity;

                // Nếu rơi xuống đáy mà chưa bị chém (và không phải bom)
                if (f.y > canvas.height + 50) {
                    if (!f.sliced && !f.isBomb) {
                        lives--;
                        updateLivesUI();
                        if (lives <= 0) {
                            gameOver();
                        }
                    }
                    fruits.splice(i, 1);
                }
            }

            // Cập nhật hiệu ứng hạt nước trái cây văng ra
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            // Mờ dần vệt chém
            sliceTrail.forEach(t => t.alpha -= 0.15);
            sliceTrail = sliceTrail.filter(t => t.alpha > 0);

            document.getElementById("score").innerText = score;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Vẽ trái cây
            fruits.forEach(f => {
                ctx.font = "36px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(f.emoji, f.x, f.y);
            });

            // Vẽ hạt tung tóe
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Vẽ vệt dao chém (đường nét sáng)
            if (sliceTrail.length > 1) {
                ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
                ctx.lineWidth = 4;
                ctx.lineCap = "round";
                ctx.beginPath();
                ctx.moveTo(sliceTrail[0].x, sliceTrail[0].y);
                for (let i = 1; i < sliceTrail.length; i++) {
                    ctx.lineTo(sliceTrail[i].x, sliceTrail[i].y);
                }
                ctx.stroke();
            }
        }

        function loop() {
            if (!isPlaying) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
