<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chặt Trái Cây Đỉnh Cao</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
</head>
<body>
{
            background: #020408;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            font-size: 1.2rem;
            margin-bottom: 4px;
            background: linear-gradient(45deg, #ff3366, #ffcc00, #00ffcc, #cc33ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            background: #0b0f19;
            border: 4px solid #1f293d;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.15), 0 25px 50px rgba(0,0,0,0.9);
            cursor: crosshair;
        }
        canvas {
            display: block;
            background: radial-gradient(circle, #182238 0%, #070a12 100%);
        }

        .ui-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(7, 10, 18, 0.95) 0%, rgba(15, 23, 42, 0.98) 100%);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 25px;
            z-index: 10;
        }

        .logo-badge {
            font-size: 3rem;
            margin-bottom: 5px;
            animation: floatLogo 2s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 15px rgba(255, 204, 0, 0.5));
        }

        @keyframes floatLogo {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }

        .ui-screen h2 {
            font-size: 1.5rem;
            margin-bottom: 6px;
            background: linear-gradient(45deg, #ffcc00, #ff3366);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .ui-screen p {
            margin-bottom: 16px;
            color: #94a3b8;
            font-size: 0.78rem;
            line-height: 1.5;
            max-width: 320px;
        }

        .section-title {
            font-size: 0.72rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .blade-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .blade-btn {
            background: rgba(30, 41, 59, 0.7);
            border: 2px solid #334155;
            color: #cbd5e1;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            transition: all 0.25s ease;
        }

        .blade-btn.active {
            border-color: #00ffcc;
            background: rgba(0, 255, 204, 0.15);
            color: #fff;
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.4);
        }

        .btn {
            background: linear-gradient(135deg, #ff3366 0%, #ff9900 100%);
            color: #fff;
            border: none;
            padding: 12px 32px;
            font-size: 1rem;
            font-weight: 800;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 51, 102, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.05); }

        #scoreboard {
            position: absolute;
            top: 12px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 0.92rem;
            font-weight: bold;
            z-index: 5;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }
        .lives { color: #ff3366; }
        
        #rage-container {
            position: absolute;
            top: 36px;
            left: 15px;
            right: 15px;
            height: 5px;
            background: #1e293b;
            border-radius: 3px;
            overflow: hidden;
            z-index: 5;
            border: 1px solid #334155;
        }
        #rage-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00ffcc, #cc33ff);
            transition: width 0.1s;
        }
        #active-effects {
            position: absolute;
            top: 46px;
            left: 15px;
            font-size: 0.7rem;
            color: #00ffcc;
            z-index: 5;
            pointer-events: none;
            font-weight: bold;
        }
        #combo-popup {
            position: absolute;
            top: 75px;
            width: 100%;
            text-align: center;
            font-size: 1.3rem;
            font-weight: 900;
            color: #00ffcc;
            text-shadow: 0 0 12px rgba(0, 255, 204, 0.9);
            z-index: 6;
            pointer-events: none;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
    </style>
</head>
<body>

    <h1>🍉 Fruit Ninja: Classic Arcade</h1>
    
    <div id="game-container">
        <div id="scoreboard">
            <div>Điểm: <span id="score">0</span> | Kỷ lục: <span id="highscore">0</span></div>
            <div class="lives">Mạng: <span id="lives">❤️❤️❤️</span></div>
        </div>
        <div id="rage-container"><div id="rage-bar"></div></div>
        <div id="active-effects"></div>
        <div id="combo-popup"></div>

        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <div id="start-screen" class="ui-screen">
            <div class="logo-badge">⚔️️🍉</div>
            <h2>Fruit Ninja Arcade</h2>
            <p>Vuốt/chém trái cây, tránh bom 💣. Đầy thanh nộ bấm <b>SPACE</b> dùng Super Nova!</p>
            
            <div class="section-title">Chọn phong cách kiếm</div>
            <div class="blade-selector">
                <button class="blade-btn active" onclick="setBlade('neon', this)">⚡ Neon Xanh</button>
                <button class="blade-btn" onclick="setBlade('fire', this)">🔥 Kiếm Lửa</button>
                <button class="blade-btn" onclick="setBlade('plasma', this)">💎 Plasma Tím</button>
            </div>

            <button class="btn" onclick="startGame()">BẮT ĐẦU CHƠI</button>
        </div>

        <div id="gameover-screen" class="ui-screen" style="display: none;">
            <div class="logo-badge">💥</div>
            <h2>GAME OVER</h2>
            <p>Điểm: <span id="final-score" style="color:#fff; font-weight:bold;">0</span><br>Kỷ lục: <span id="final-highscore" style="color:#ffcc00; font-weight:bold;">0</span></p>
            <button class="btn" onclick="startGame()">CHƠI LẠI</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const container = document.getElementById("game-container");

        let currentBlade = 'neon';
        function setBlade(type, btn) {
            currentBlade = type;
            document.querySelectorAll('.blade-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        let audioCtx = null;
        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'slice') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.07);
                    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.07);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.07);
                } else if (type === 'bomb') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(20, audioCtx.currentTime + 0.45);
                    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.45);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.45);
                } else if (type === 'nova') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(250, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1300, audioCtx.currentTime + 0.5);
                    gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.5);
                }
            } catch(e) {}
        }

        let score = 0;
        let highscore = localStorage.getItem("fruit_ninja_hs") || 0;
        document.getElementById("highscore").innerText = highscore;

        let lives = 3, isPlaying = false;
        let fruits = [], halvedFruits = [], juiceDrops = [], splashes = [], sliceTrail = [];
        let spawnTimer = 0, doublePointsTimer = 0, freezeTimer = 0, frenzyTimer = 0;
        let superNovaFlash = 0, screenShakeTimer = 0, hitStopFrames = 0, rageEnergy = 0;

        const fruitTypes = [
            { emoji: '🍉', radius: 34, points: 1, juice: '#ff3344' },
            { emoji: '🍎', radius: 27, points: 1, juice: '#ffcc00' },
            { emoji: '🍊', radius: 29, points: 2, juice: '#ff8800' },
            { emoji: '🍇', radius: 25, points: 3, juice: '#9933ff' },
            { emoji: '🍌❄️', radius: 30, isFreeze: true, juice: '#e0f7fc' },
            { emoji: '🍍✨', radius: 31, isDouble: true, juice: '#ffeb3b' },
            { emoji: '💥🌟', radius: 33, isNova: true, juice: '#00e5ff' },
            { emoji: '💣', radius: 30, isBomb: true }
        ];

        let isDragging = false;

        function addPoint(x, y) {
            sliceTrail.push({ x, y, alpha: 1 });
            if (sliceTrail.length > 12) sliceTrail.shift();
        }

        window.addEventListener("keydown", (e) => {
            if (e.code === "Space" && isPlaying && rageEnergy >= 100) {
                triggerSuperNova();
                rageEnergy = 0;
                document.getElementById("rage-bar").style.width = "0%";
                e.preventDefault();
            }
        });

        canvas.addEventListener("mousedown", (e) => {
            isDragging = true;
            let rect = canvas.getBoundingClientRect();
            addPoint(e.clientX - rect.left, e.clientY - rect.top);
        });

        canvas.addEventListener("mousemove", (e) => {
            if (!isDragging || !isPlaying) return;
            let rect = canvas.getBoundingClientRect();
            let x = e.clientX - rect.left, y = e.clientY - rect.top;
            addPoint(x, y);
            checkSlice(x, y);
        });

        window.addEventListener("mouseup", () => { isDragging = false; sliceTrail = []; });

        canvas.addEventListener("touchstart", (e) => {
            isDragging = true;
            let rect = canvas.getBoundingClientRect();
            let x = e.touches[0].clientX - rect.left, y = e.touches[0].clientY - rect.top;
            addPoint(x, y);
            e.preventDefault();
        });

        canvas.addEventListener("touchmove", (e) => {
            if (!isDragging || !isPlaying) return;
            let rect = canvas.getBoundingClientRect();
            let x = e.touches[0].clientX - rect.left, y = e.touches[0].clientY - rect.top;
            addPoint(x, y);
            checkSlice(x, y);
            e.preventDefault();
        });

        canvas.addEventListener("touchend", () => { isDragging = false; sliceTrail = []; });

        function startGame() {
            document.getElementById("start-screen").style.display = "none";
            document.getElementById("gameover-screen").style.display = "none";
            score = 0; lives = 3; fruits = []; halvedFruits = []; juiceDrops = []; splashes = [];
            spawnTimer = 0; doublePointsTimer = 0; freezeTimer = 0; frenzyTimer = 0;
            superNovaFlash = 0; screenShakeTimer = 0; hitStopFrames = 0; rageEnergy = 0;
            document.getElementById("rage-bar").style.width = "0%";
            isPlaying = true;
            updateLivesUI();
            loop();
        }

        function triggerSuperNova() {
            playSound('nova');
            superNovaFlash = 25; screenShakeTimer = 20;
            fruits.forEach(f => {
                if (!f.sliced && !f.isBomb) {
                    f.sliced = true;
                    score += (f.points || 1) * 3;
                    createJuiceExplosion(f.x, f.y, f.juice || '#ff3366');
                    createHalved(f.x, f.y, f.emoji, f.juice || '#ff3366');
                }
            });
            showCombo("💥 SUPER NOVA ULTIMATE! 💥");
        }

        function gameOver() {
            isPlaying = false;
            playSound('bomb');
            screenShakeTimer = 30;
            if (score > highscore) {
                highscore = score;
                localStorage.setItem("fruit_ninja_hs", highscore);
                document.getElementById("highscore").innerText = highscore;
            }
            document.getElementById("final-score").innerText = score;
            document.getElementById("final-highscore").innerText = highscore;
            document.getElementById("gameover-screen").style.display = "flex";
        }

        function updateLivesUI() {
            let h = ""; for (let i = 0; i < lives; i++) h += "❤️";
            document.getElementById("lives").innerText = h;
        }

        function showCombo(text) {
            let el = document.getElementById("combo-popup");
            el.innerText = text;
            el.style.opacity = "1";
            el.style.transform = "scale(1.2)";
            setTimeout(() => { el.style.opacity = "0"; el.style.transform = "scale(0.8)"; }, 900);
        }

        function spawnFruit() {
            let t = fruitTypes[Math.floor(Math.random() * fruitTypes.length)];
            if ((t.isBomb || t.isFreeze || t.isDouble || t.isNova) && Math.random() > 0.35) t = fruitTypes[0];
            let x = Math.random() * (canvas.width - 100) + 50;
            let vx = (canvas.width / 2 - x) * 0.02 + (Math.random() - 0.5) * 2;
            let vy = -Math.random() * 4 - 11;
            if (frenzyTimer > 0) vy -= 3;
            fruits.push({ x, y: canvas.height + 40, vx, vy, gravity: 0.35, ...t, sliced: false });
        }

        // --- HỆ THỐNG HIỆU ỨNG CẮT CHUẨN XỊN (FRUIT NINJA STYLE) ---
        function createJuiceExplosion(x, y, juiceColor) {
            // Hạt nước trái cây văng hướng tâm
            for (let i = 0; i < 20; i++) {
                juiceDrops.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 14,
                    vy: (Math.random() - 0.5) * 14,
                    radius: Math.random() * 5 + 2,
                    color: juiceColor,
                    alpha: 1,
                    gravity: 0.45
                });
            }
            // Vệt nhựa trái cây bám trên kính màn hình
            for (let i = 0; i < 3; i++) {
                splashes.push({
                    x: x + (Math.random() - 0.5) * 40,
                    y: y + (Math.random() - 0.5) * 40,
                    radius: Math.random() * 14 + 6,
                    color: juiceColor,
                    alpha: 0.75
                });
            }
        }

        function createHalved(x, y, emoji, juiceColor) {
            halvedFruits.push({ x, y, vx: -4.5, vy: -5.5, gravity: 0.45, rotation: 0, vRot: -0.2, emoji, juiceColor, alpha: 1 });
            halvedFruits.push({ x, y, vx: 4.5, vy: -5.5, gravity: 0.45, rotation: 0, vRot: 0.2, emoji, juiceColor, alpha: 1 });
        }

        function checkSlice(x, y) {
            let sliced = 0;
            fruits.forEach(f => {
                if (!f.sliced) {
                    let dist = Math.hypot(f.x - x, f.y - y);
                    if (dist < f.radius + 20) {
                        f.sliced = true;
                        sliced++;
                        if (f.isBomb) {
                            lives = 0; updateLivesUI(); gameOver();
                        } else {
                            playSound('slice');
                            createJuiceExplosion(f.x, f.y, f.juice || '#ff3344');
                            createHalved(f.x, f.y, f.emoji, f.juice || '#ff3344');
                            hitStopFrames = 3; // Khựng lực tạo cảm giác chém sắc

                            let pts = f.points || 1;
                            if (doublePointsTimer > 0) pts *= 2;

                            if (f.isFreeze) { freezeTimer = 300; showCombo("❄️ ĐÓNG BĂNG!"); }
                            else if (f.isDouble) { doublePointsTimer = 300; showCombo("🍍 x2 ĐIỂM SỐ!"); }
                            else if (f.isNova) { triggerSuperNova(); }

                            score += pts;
                            if (rageEnergy < 100) {
                                rageEnergy = Math.min(100, rageEnergy + 8);
                                document.getElementById("rage-bar").style.width = rageEnergy + "%";
                                if (rageEnergy === 100) showCombo("⚡ NỘ ĐẦY! BẤM SPACE!");
                            }
                        }
                    }
                }
            });

            if (sliced >= 2 && sliced < 4) {
                showCombo(`🔥 COMBO x${sliced}!`);
                score += sliced * 2;
                rageEnergy = Math.min(100, rageEnergy + 6);
                document.getElementById("rage-bar").style.width = rageEnergy + "%";
            } else if (sliced >= 4) {
                showCombo(`👑 LEGENDARY x${sliced}!!`);
                score += sliced * 5;
                rageEnergy = Math.min(100, rageEnergy + 15);
                document.getElementById("rage-bar").style.width = rageEnergy + "%";
            }
        }

        function update() {
            if (!isPlaying) return;
            if (hitStopFrames > 0) { hitStopFrames--; return; }

            if (freezeTimer > 0) freezeTimer--;
            if (doublePointsTimer > 0) doublePointsTimer--;
            if (frenzyTimer > 0) frenzyTimer--;
            if (superNovaFlash > 0) superNovaFlash--;
            if (screenShakeTimer > 0) screenShakeTimer--;

            if (screenShakeTimer > 0) {
                container.style.transform = `translate(${(Math.random()-0.5)*8}px, ${(Math.random()-0.5)*8}px)`;
            } else {
                container.style.transform = `translate(0, 0)`;
            }

            let eff = "";
            if (freezeTimer > 0) eff += `❄️ Đóng băng: ${(freezeTimer/60).toFixed(1)}s  `;
            if (doublePointsTimer > 0) eff += `🍍 x2: ${(doublePointsTimer/60).toFixed(1)}s  `;
            if (frenzyTimer > 0) eff += `🔥 FRENZY! `;
            document.getElementById("active-effects").innerText = eff;

            if (score > 0 && score % 35 === 0 && frenzyTimer <= 0 && Math.random() < 0.15) {
                frenzyTimer = 250; showCombo("🌟 MƯA TRÁI CÂY BÙNG NỔ! 🌟");
            }

            let spInterval = (freezeTimer > 0) ? 75 : (frenzyTimer > 0 ? 18 : 42);
            spawnTimer++;
            if (spawnTimer > spInterval) {
                spawnTimer = 0; spawnFruit();
                if (frenzyTimer > 0 || Math.random() > 0.5) spawnFruit();
            }

            let sf = (freezeTimer > 0) ? 0.35 : 1;

            for (let i = fruits.length - 1; i >= 0; i--) {
                let f = fruits[i];
                f.x += f.vx * sf; f.y += f.vy * sf; f.vy += f.gravity * sf;
                if (f.y > canvas.height + 50) {
                    if (!f.sliced && !f.isBomb) { lives--; updateLivesUI(); if (lives <= 0) gameOver(); }
                    fruits.splice(i, 1);
                }
            }

            for (let i = halvedFruits.length - 1; i >= 0; i--) {
                let h = halvedFruits[i];
                h.x += h.vx; h.y += h.vy; h.vy += h.gravity;
                h.rotation += h.vRot; h.alpha -= 0.02;
                if (h.alpha <= 0 || h.y > canvas.height + 50) halvedFruits.splice(i, 1);
            }

            for (let i = juiceDrops.length - 1; i >= 0; i--) {
                let p = juiceDrops[i];
                p.x += p.vx; p.y += p.vy; p.vy += p.gravity; p.alpha -= 0.03;
                if (p.alpha <= 0) juiceDrops.splice(i, 1);
            }

            splashes.forEach(s => s.alpha -= 0.003);
            splashes = splashes.filter(s => s.alpha > 0);

            sliceTrail.forEach(t => t.alpha -= 0.15);
            sliceTrail = sliceTrail.filter(t => t.alpha > 0);
            document.getElementById("score").innerText = score;
        }

        function draw() {
            if (superNovaFlash > 0) {
                ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                return;
            }

            if (frenzyTimer > 0) {
                ctx.fillStyle = "rgba(204, 51, 255, 0.18)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }

            // 1. Vết nhựa trái cây bám trên màn hình
            splashes.forEach(s => {
                ctx.save();
                ctx.globalAlpha = s.alpha;
                ctx.fillStyle = s.color;
                ctx.beginPath(); ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            });

            // 2. Trái cây nguyên vẹn
            fruits.forEach(f => {
                ctx.font = f.isBomb ? "38px Arial" : "34px Arial";
                ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText(f.emoji, f.x, f.y);
            });

            // 3. Hai nửa trái cây (có tâm lõi rỉ nước chuẩn game cổ điển)
            halvedFruits.forEach(h => {
                ctx.save();
                ctx.globalAlpha = h.alpha;
                ctx.translate(h.x, h.y);
                ctx.rotate(h.rotation);
                
                ctx.fillStyle = h.juiceColor;
                ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();

                ctx.font = "26px Arial";
                ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText(h.emoji, 0, 0);
                ctx.restore();
            });

            // 4. Hạt nước tung tóe
            juiceDrops.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            });

            // 5. Vệt chém sắc bén có đuôi mờ phong cách game thùng
            if (sliceTrail.length > 1) {
                let col = "0, 255, 204";
                if (currentBlade === 'fire') col = "255, 51, 102";
                if (currentBlade === 'plasma') col = "204, 51, 255";

                ctx.strokeStyle = `rgba(${col}, 0.95)`;
                ctx.lineWidth = 7;
                ctx.lineCap = "round";
                ctx.lineJoin = "round";
                ctx.beginPath();
                ctx.moveTo(sliceTrail[0].x, sliceTrail[0].y);
                for (let i = 1; i < sliceTrail.length; i++) {
                    ctx.lineTo(sliceTrail[i].x, sliceTrail[i].y);
                }
                ctx.stroke();
            }
        }

        function loop() {
            if (!isPlaying) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
